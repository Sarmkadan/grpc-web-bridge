# Prometheus configuration for monitoring gRPC-Web Bridge

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'grpc-web-bridge-monitor'

# Alerting configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - localhost:9093

# Load rules once and periodically evaluate them
rule_files:
  - "alert_rules.yml"

# Scrape configurations
scrape_configs:
  # Monitor Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Monitor gRPC-Web Bridge
  - job_name: 'grpc-web-bridge'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['localhost:5000']
    scrape_interval: 10s
    scrape_timeout: 5s
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
      - source_labels: [__scheme__]
        target_label: scheme

  # Monitor backend gRPC services
  - job_name: 'grpc-services'
    static_configs:
      - targets:
        - user-service:50051
        - order-service:50051
        - payment-service:50051
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance

  # Monitor Docker containers (if using docker)
  - job_name: 'docker'
    static_configs:
      - targets: ['localhost:9323']
    scheme: http

  # Monitor system metrics via node-exporter
  - job_name: 'node'
    static_configs:
      - targets: ['localhost:9100']

# Remote storage configuration (optional)
# remote_write:
#   - url: http://influxdb:8086/api/v1/prom/write?db=prometheus
# remote_read:
#   - url: http://influxdb:8086/api/v1/prom/read?db=prometheus
