# Complete Kubernetes deployment manifests for gRPC-Web Bridge
# Deploy with: kubectl apply -f kubernetes.yaml

---
# Namespace
apiVersion: v1
kind: Namespace
metadata:
  name: grpc-bridge

---
# ConfigMap for application configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: grpc-web-bridge-config
  namespace: grpc-bridge
data:
  appsettings.json: |
    {
      "Logging": {
        "LogLevel": {
          "Default": "Information",
          "Microsoft": "Warning"
        }
      },
      "GrpcWebBridge": {
        "Environment": "Production",
        "MaxStreamCount": 5000,
        "StreamIdleTimeoutSeconds": 300,
        "RequireAuthentication": true,
        "AllowedOrigins": [
          "https://app.example.com",
          "https://admin.example.com"
        ]
      }
    }

---
# Secret for TLS certificates
apiVersion: v1
kind: Secret
metadata:
  name: grpc-web-bridge-tls
  namespace: grpc-bridge
type: kubernetes.io/tls
data:
  tls.crt: LS0tLS1CRUdJTi...  # Base64 encoded certificate
  tls.key: LS0tLS1CRUdJTi...  # Base64 encoded key

---
# Service Account
apiVersion: v1
kind: ServiceAccount
metadata:
  name: grpc-web-bridge
  namespace: grpc-bridge

---
# Role for service account
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: grpc-web-bridge
  namespace: grpc-bridge
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get"]

---
# RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: grpc-web-bridge
  namespace: grpc-bridge
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: grpc-web-bridge
subjects:
- kind: ServiceAccount
  name: grpc-web-bridge
  namespace: grpc-bridge

---
# Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grpc-web-bridge
  namespace: grpc-bridge
  labels:
    app: grpc-web-bridge
    version: "1.2.0"
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: grpc-web-bridge
  template:
    metadata:
      labels:
        app: grpc-web-bridge
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "5000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: grpc-web-bridge
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
      - name: grpc-web-bridge
        image: grpc-web-bridge:1.2.0
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 5000
          protocol: TCP
        - name: https
          containerPort: 5001
          protocol: TCP
        env:
        - name: ASPNETCORE_ENVIRONMENT
          value: "Production"
        - name: ASPNETCORE_URLS
          value: "http://+:5000;https://+:5001"
        - name: GrpcWebBridge__MaxStreamCount
          value: "5000"
        - name: GrpcWebBridge__RequireAuthentication
          value: "true"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health/live
            port: http
            scheme: HTTP
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health/ready
            port: http
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
        volumeMounts:
        - name: config
          mountPath: /app/config
          readOnly: true
        - name: logs
          mountPath: /app/logs
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
            - ALL
      volumes:
      - name: config
        configMap:
          name: grpc-web-bridge-config
      - name: logs
        emptyDir: {}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - grpc-web-bridge
              topologyKey: kubernetes.io/hostname
      terminationGracePeriodSeconds: 30

---
# Service (LoadBalancer)
apiVersion: v1
kind: Service
metadata:
  name: grpc-web-bridge
  namespace: grpc-bridge
  labels:
    app: grpc-web-bridge
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: http
    protocol: TCP
    name: http
  - port: 443
    targetPort: https
    protocol: TCP
    name: https
  selector:
    app: grpc-web-bridge

---
# Service (ClusterIP for internal access)
apiVersion: v1
kind: Service
metadata:
  name: grpc-web-bridge-internal
  namespace: grpc-bridge
  labels:
    app: grpc-web-bridge
spec:
  type: ClusterIP
  ports:
  - port: 5000
    targetPort: http
    protocol: TCP
    name: http
  - port: 5001
    targetPort: https
    protocol: TCP
    name: https
  selector:
    app: grpc-web-bridge

---
# HorizontalPodAutoscaler
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: grpc-web-bridge
  namespace: grpc-bridge
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: grpc-web-bridge
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30
      - type: Pods
        value: 1
        periodSeconds: 30

---
# PodDisruptionBudget
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: grpc-web-bridge
  namespace: grpc-bridge
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: grpc-web-bridge

---
# Ingress
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grpc-web-bridge
  namespace: grpc-bridge
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/grpc-services: "grpc-web-bridge"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - grpc-bridge.example.com
    secretName: grpc-bridge-tls
  rules:
  - host: grpc-bridge.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: grpc-web-bridge
            port:
              number: 5000

---
# NetworkPolicy
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: grpc-web-bridge
  namespace: grpc-bridge
spec:
  podSelector:
    matchLabels:
      app: grpc-web-bridge
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
    ports:
    - protocol: TCP
      port: 5000
    - protocol: TCP
      port: 5001
  egress:
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 50051  # Backend gRPC services
    - protocol: TCP
      port: 53  # DNS
  - to:
    - namespaceSelector:
        matchLabels:
          name: kube-system
    ports:
    - protocol: TCP
      port: 53  # CoreDNS

---
# Deployment of backend gRPC service (example)
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: grpc-bridge
spec:
  ports:
  - name: grpc
    port: 50051
    targetPort: 50051
  clusterIP: None
  selector:
    app: user-service

---
# ServiceMonitor for Prometheus (if using Prometheus Operator)
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: grpc-web-bridge
  namespace: grpc-bridge
spec:
  selector:
    matchLabels:
      app: grpc-web-bridge
  endpoints:
  - port: http
    path: /metrics
    interval: 30s
