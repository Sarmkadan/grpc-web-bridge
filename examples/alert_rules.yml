# Prometheus alert rules for gRPC-Web Bridge

groups:
  - name: grpc-web-bridge
    interval: 30s
    rules:
      # Bridge availability alerts
      - alert: BridgeDown
        expr: up{job="grpc-web-bridge"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "gRPC-Web Bridge is down"
          description: "Bridge instance {{ $labels.instance }} has been down for 2 minutes"

      # Performance alerts
      - alert: HighLatency
        expr: histogram_quantile(0.95, grpc_web_bridge_request_duration_seconds_bucket) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High request latency detected"
          description: "P95 latency is {{ $value }}s on {{ $labels.instance }}"

      - alert: HighErrorRate
        expr: rate(grpc_web_bridge_request_errors_total[5m]) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High error rate detected"
          description: "Error rate is {{ $value }} on {{ $labels.instance }}"

      # Resource alerts
      - alert: HighCpuUsage
        expr: process_cpu_seconds_total > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage detected"
          description: "CPU usage is {{ $value }}% on {{ $labels.instance }}"

      - alert: HighMemoryUsage
        expr: process_resident_memory_bytes > 536870912  # 512MB
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage detected"
          description: "Memory usage is {{ humanize $value }} on {{ $labels.instance }}"

      # Stream alerts
      - alert: MaxStreamsApproaching
        expr: grpc_web_bridge_active_streams > 4500
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Approaching maximum stream limit"
          description: "Active streams: {{ $value }} on {{ $labels.instance }}"

      - alert: StreamLeakDetected
        expr: increase(grpc_web_bridge_stream_cleanup_failures_total[10m]) > 10
        labels:
          severity: critical
        annotations:
          summary: "Stream cleanup failures detected"
          description: "{{ $value }} stream cleanup failures in the last 10 minutes"

      # Backend service alerts
      - alert: BackendServiceUnreachable
        expr: grpc_web_bridge_backend_service_unreachable_total > 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Backend service unreachable"
          description: "Service {{ $labels.service_name }} is unreachable from {{ $labels.instance }}"

      - alert: BackendServiceHighLatency
        expr: histogram_quantile(0.95, grpc_web_bridge_backend_latency_seconds_bucket) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Backend service high latency"
          description: "Service {{ $labels.service_name }} P95 latency: {{ $value }}s"

      # Rate limiting alerts
      - alert: RateLimitExceeded
        expr: rate(grpc_web_bridge_rate_limit_exceeded_total[5m]) > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Rate limit exceeded"
          description: "{{ $value }} clients exceeded rate limit in the last 5 minutes"

      # Authentication alerts
      - alert: AuthenticationFailures
        expr: rate(grpc_web_bridge_authentication_failures_total[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High authentication failure rate"
          description: "Authentication failure rate: {{ $value }} on {{ $labels.instance }}"

      # Cache alerts
      - alert: LowCacheHitRate
        expr: grpc_web_bridge_cache_hit_rate < 0.5
        for: 10m
        labels:
          severity: info
        annotations:
          summary: "Low cache hit rate"
          description: "Cache hit rate is {{ $value }}% on {{ $labels.instance }}"

      # Disk space alerts (if using file-based storage)
      - alert: DiskSpaceLow
        expr: node_filesystem_avail_bytes{mountpoint="/"} < 1073741824  # 1GB
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Low disk space"
          description: "Disk space available: {{ humanize $value }} on {{ $labels.instance }}"

  - name: kubernetes
    interval: 30s
    rules:
      # Pod resource alerts
      - alert: HighPodCpuUsage
        expr: sum(rate(container_cpu_usage_seconds_total{pod=~"grpc-web-bridge.*"}[5m])) > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High pod CPU usage"
          description: "CPU usage is {{ $value }} for pod {{ $labels.pod }}"

      - alert: HighPodMemoryUsage
        expr: sum(container_memory_usage_bytes{pod=~"grpc-web-bridge.*"}) > 536870912
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High pod memory usage"
          description: "Memory usage is {{ humanize $value }} for pod {{ $labels.pod }}"

      # Pod restart alerts
      - alert: PodRestartingFrequently
        expr: rate(kube_pod_container_status_restarts_total{pod=~"grpc-web-bridge.*"}[1h]) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Pod restarting frequently"
          description: "Pod {{ $labels.pod }} restarted {{ $value }} times in the last hour"
